name: Tests

on:
  pull_request:
  workflow_call: # deploy.yml викликає цей самий job як гейт перед деплоєм

# Тут, а не в job: накриває обидва входи — і pull_request, і виклик із deploy.yml.
# Зараз у репозиторії токен і так лише на читання; рядок фіксує це у файлі, щоб
# зміна налаштувань репозиторію колись не розширила права мовчки.
permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  # На PR новий пуш скасовує попередній прогін. Для виклику з deploy.yml — ні:
  # скасований тест зняв би гейт перед деплоєм.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Після checkout тут лише uv sync і pytest — токен у .git/config
          # робочої копії не потрібен нікому.
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      # --locked: без нього uv сам оновив би uv.lock, якби pyproject.toml із ним
      # розійшовся, і тести пройшли б проти версій, яких у репозиторії немає.
      # Тепер забутий `uv lock` валить CI, а не проходить непоміченим.
      - run: uv sync --locked
      - run: uv run --locked pytest
